name: Peko compliance check
description: >-
  Check an iOS or Android project against the App Store and Google Play
  policies, and put each finding on the pull request diff.
author: Peko UI Technologies LLC

branding:
  icon: shield
  color: blue

inputs:
  path:
    description: The project to check.
    required: false
    default: "."
  platform:
    description: >-
      ios or android. Read from .pekorc.json when this is empty.
    required: false
    default: ""
  all:
    description: >-
      Check the whole project rather than what changed. A pull request run
      wants the whole project, because a rule can fail on a file the branch
      never touched.
    required: false
    default: "true"
  fail-on:
    description: >-
      The severity that fails the step. error, warning, or info.
    required: false
    default: "error"
  sarif-file:
    description: Where to write the SARIF report.
    required: false
    default: "peko.sarif"
  upload-sarif:
    description: >-
      Upload the SARIF to Code Scanning. Needs security-events write. Set it
      to false on a fork, where that permission is not granted.
    required: false
    default: "true"
  version:
    description: >-
      The release to install. Pin it, so a new rule does not fail a build
      that passed yesterday without anybody changing anything.
    required: false
    default: "latest"
  api-key:
    description: >-
      A Peko API key, for the audit tier. The mechanical checks run on the
      runner and need no key.
    required: false
    default: ""

outputs:
  sarif-file:
    description: The SARIF report this run wrote.
    value: ${{ steps.run.outputs.sarif-file }}
  findings:
    description: How many findings the run raised.
    value: ${{ steps.run.outputs.findings }}

runs:
  using: composite
  steps:
    - name: Install peko
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)   target=x86_64-unknown-linux-gnu ;;
          Linux-aarch64)  target=aarch64-unknown-linux-gnu ;;
          Darwin-x86_64)  target=x86_64-apple-darwin ;;
          Darwin-arm64)   target=aarch64-apple-darwin ;;
          *) echo "peko has no build for $(uname -s)-$(uname -m)" >&2; exit 1 ;;
        esac

        version="${{ inputs.version }}"
        if [ "$version" = "latest" ]; then
          base="https://github.com/peko-ui/peko/releases/latest/download"
        else
          base="https://github.com/peko-ui/peko/releases/download/${version}"
        fi

        mkdir -p "$RUNNER_TEMP/peko"
        curl -fsSL "$base/peko-${target}" -o "$RUNNER_TEMP/peko/peko"
        curl -fsSL "$base/peko-${target}.sha256" -o "$RUNNER_TEMP/peko/peko.sha256"

        # Verify what arrived. A download nobody checks is a download anybody
        # can replace, and this one is about to read the whole repository.
        #
        # The hash is computed and compared as a string rather than with a
        # -c file. A macOS runner has shasum and may not have sha256sum, and
        # the two disagree about the check file format.
        cd "$RUNNER_TEMP/peko"
        if command -v sha256sum >/dev/null 2>&1; then
          got=$(sha256sum peko | awk '{print $1}')
        else
          got=$(shasum -a 256 peko | awk '{print $1}')
        fi
        want=$(awk '{print $1}' peko.sha256)
        if [ "$got" != "$want" ]; then
          echo "::error::The downloaded peko binary does not match its checksum."
          echo "expected $want"
          echo "got      $got"
          exit 1
        fi
        chmod +x peko
        echo "$RUNNER_TEMP/peko" >> "$GITHUB_PATH"

    - name: Run peko
      id: run
      shell: bash
      env:
        PEKO_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        args=(lint --sarif "${{ inputs.sarif-file }}" --fail-on "${{ inputs.fail-on }}")
        [ "${{ inputs.all }}" = "true" ] && args+=(--all)
        [ -n "${{ inputs.platform }}" ] && args+=(--platform "${{ inputs.platform }}")

        cd "${{ inputs.path }}"
        # Keep the exit code. The upload has to happen either way, so the step
        # reports the result at the end rather than stopping here.
        set +e
        peko "${args[@]}"
        code=$?
        set -e

        echo "sarif-file=${{ inputs.sarif-file }}" >> "$GITHUB_OUTPUT"
        if [ -f "${{ inputs.sarif-file }}" ]; then
          findings=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))['runs'][0]['results']))" "${{ inputs.sarif-file }}")
        else
          findings=0
        fi
        echo "findings=$findings" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    # Upload before failing. A run that fails without uploading leaves the
    # findings nowhere a reviewer can see them, which is the whole point.
    - name: Upload to Code Scanning
      if: ${{ inputs.upload-sarif == 'true' && always() }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.path }}/${{ inputs.sarif-file }}
        category: peko

    - name: Report the result
      shell: bash
      run: |
        set -euo pipefail
        code="${{ steps.run.outputs.exit-code }}"
        echo "Peko raised ${{ steps.run.outputs.findings }} findings."
        if [ "$code" != "0" ]; then
          echo "::error::Peko found a problem at or above ${{ inputs.fail-on }}. See the Code Scanning tab."
          exit "$code"
        fi
