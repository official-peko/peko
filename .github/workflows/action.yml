name: The action

# Run the action against the example projects, on every platform it claims to
# support.
#
# Nothing did this before. The action was written, documented, and told to
# people, and no run of it had ever happened. Its install step refused Windows
# outright while every release shipped a Windows build, and the version the
# README told people to use resolved to no tag at all.
#
# A release is what this tests against, so it runs after one and on demand.

on:
  push:
    branches: [main]
    paths:
      - "action.yml"
      - "examples/**"
      - ".github/workflows/action.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: The release to test, or latest
        required: false
        default: latest

permissions:
  contents: read

jobs:
  run:
    name: ${{ matrix.os }} / ${{ matrix.example }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the others. Windows is the one most
      # likely to break, and it is the one nobody would notice.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        example: [ios-app, android-app, ios-audit, android-audit]
        include:
          # The -app pair carries planted mechanical problems, so the lint has
          # to report them. The -audit pair is mechanically clean, so the lint
          # has to report nothing and pass. A lint that always finds something
          # is as useless as one that never does, and only the second pair
          # catches that.
          - example: ios-app
            expect: problems
            fail-on: never
          - example: android-app
            expect: problems
            fail-on: never
          - example: ios-audit
            expect: clean
            fail-on: error
          - example: android-audit
            expect: clean
            fail-on: error

    steps:
      - uses: actions/checkout@v4

      - name: Run the action on examples/${{ matrix.example }}
        id: peko
        uses: ./
        with:
          path: examples/${{ matrix.example }}
          version: ${{ github.event.inputs.version || 'latest' }}
          # The -app pair holds real problems on purpose, so an error there is
          # the expected result and must not fail the job. The -audit pair is
          # clean, so an error there is a regression and must fail it.
          fail-on: ${{ matrix.fail-on }}
          # Code Scanning takes one SARIF per ref, and six jobs would race to
          # be the one it kept. The report is checked below instead.
          upload-sarif: false
          sarif-file: peko.sarif

      - name: The run reported what this example carries
        shell: bash
        env:
          # The action writes it inside the project it checked, and reports
          # where. Looking in the working directory finds nothing.
          SARIF: ${{ steps.peko.outputs.sarif-file }}
          EXPECT: ${{ matrix.expect }}
        run: |
          set -euo pipefail
          test -s "$SARIF" || { echo "the action wrote no SARIF at $SARIF"; exit 1; }

          python3 - <<'PY'
          import json, os, sys

          results = json.load(open(os.environ["SARIF"]))["runs"][0]["results"]
          expect = os.environ["EXPECT"]
          print(f"the run raised {len(results)} findings")

          # A finding has to name its rule, or nobody can look it up.
          for result in results:
              assert result.get("ruleId"), "a finding with no rule id"

          if expect == "clean":
              # An error or a warning here means the example drifted. The
              # audit tier needs a project the lint lets through, and a
              # regression that quietly puts one back is the whole risk.
              loud = [
                  r["ruleId"] for r in results
                  if r.get("level") in ("error", "warning")
              ]
              if loud:
                  print("::error::this example must pass the lint: " + ", ".join(loud))
                  sys.exit(1)
              sys.exit(0)

          # An example with no findings is an example that teaches nothing, and
          # a run reporting none of them is an engine that did not read it.
          if len(results) < 3:
              print(f"::error::this example carries known problems and only {len(results)} were found")
              sys.exit(1)

          # Most findings name a file, and a run where none of them does is an
          # engine that read nothing. But not every finding can: "this project
          # has no privacy manifest" is about a file that does not exist, and
          # pointing at one that does would be a lie for the sake of a line
          # number. Those are counted and named rather than demanded.
          placed = [r["ruleId"] for r in results if r.get("locations")]
          unplaced = [r["ruleId"] for r in results if not r.get("locations")]
          assert placed, "no finding named a file, so nothing was really read"
          print(f"{len(placed)} of {len(results)} findings name a file")
          if unplaced:
              print("about something absent, so no file to name: " + ", ".join(unplaced))
          PY
