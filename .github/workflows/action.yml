name: The action

# Run the action against the example projects, on every platform it claims to
# support.
#
# Nothing did this before. The action was written, documented, and told to
# people, and no run of it had ever happened. Its install step refused Windows
# outright while every release shipped a Windows build, and the version the
# README told people to use resolved to no tag at all.
#
# A release is what this tests against, so it runs after one and on demand.

on:
  push:
    branches: [main]
    paths:
      - "action.yml"
      - "examples/**"
      - ".github/workflows/action.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: The release to test, or latest
        required: false
        default: latest

permissions:
  contents: read

jobs:
  run:
    name: ${{ matrix.os }} / ${{ matrix.example }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the others. Windows is the one most
      # likely to break, and it is the one nobody would notice.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        example: [ios-app, android-app]

    steps:
      - uses: actions/checkout@v4

      - name: Run the action on examples/${{ matrix.example }}
        id: peko
        uses: ./
        with:
          path: examples/${{ matrix.example }}
          version: ${{ github.event.inputs.version || 'latest' }}
          # These examples hold real problems on purpose, so an error is the
          # expected result and must not fail the job.
          fail-on: never
          # Code Scanning takes one SARIF per ref, and six jobs would race to
          # be the one it kept. The report is checked below instead.
          upload-sarif: false
          sarif-file: peko.sarif

      - name: The run found the problems the example carries
        shell: bash
        env:
          # The action writes it inside the project it checked, and reports
          # where. Looking in the working directory finds nothing.
          SARIF: ${{ steps.peko.outputs.sarif-file }}
        run: |
          set -euo pipefail
          test -s "$SARIF" || { echo "the action wrote no SARIF at $SARIF"; exit 1; }

          # An example with no findings is an example that teaches nothing, and
          # a run reporting none of them is an engine that did not read it.
          count=$(python3 -c "import json,os;d=json.load(open(os.environ['SARIF']));print(len(d['runs'][0]['results']))")
          echo "the run raised $count findings"
          if [ "$count" -lt 3 ]; then
            echo "::error::examples/${{ matrix.example }} carries known problems and only $count were found"
            exit 1
          fi

          # A finding has to name its rule, or nobody can look it up.
          #
          # Most name a file too, and a run where none of them does is an
          # engine that read nothing. But not every finding can: "this project
          # has no privacy manifest" is about a file that does not exist, and
          # pointing at one that does would be a lie for the sake of a line
          # number. Those are counted and named rather than demanded.
          python3 - <<'PY'
          import json, os
          results = json.load(open(os.environ["SARIF"]))["runs"][0]["results"]
          placed, unplaced = [], []
          for result in results:
              rule = result.get("ruleId", "")
              assert rule, "a finding with no rule id"
              (placed if result.get("locations") else unplaced).append(rule)

          assert placed, "no finding named a file, so nothing was really read"
          print(f"{len(placed)} of {len(results)} findings name a file")
          if unplaced:
              print("about something absent, so no file to name: " + ", ".join(unplaced))
          PY
