[package]
name = "peko-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "peko_cli"
path = "src/lib.rs"

[[bin]]
name = "peko"
path = "src/main.rs"

[dependencies]
# Already in this binary three times over through other crates, so naming
# it costs nothing and stops a hand rolled date routine existing.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1.0"
peko-check = { version = "1.4.0", path = "../peko-check" }
peko-report = { version = "1.4.0", path = "../peko-report" }
peko-rules = { version = "1.4.0", path = "../peko-rules" }
base64 = "0.22"
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"

[lints]
workspace = true
